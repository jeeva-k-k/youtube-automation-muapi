name: C218 Manim Pilot Render

on:
  pull_request:
    branches: [master]
    paths:
      - "c218_manim_pilot/**"
      - ".github/workflows/c218-manim-pilot.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config

      - name: Install Manim stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install "manim==0.20.1" "numpy>=2.0" "scipy>=1.12"
          manim --version

      - name: Apply pilot QC patches
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("c218_manim_pilot/main.py")
          s = p.read_text()
          replacements = {
              "VGroup(shell, head, sub, badge_box, badge, liquid)": "Group(shell, head, sub, badge_box, badge, liquid)",
              "VGroup(shell, head, tip, curved, call, sub, liquid)": "Group(shell, head, tip, curved, call, sub, liquid)",
              "VGroup(shell, head, tracers, box, badge, sub, liquid)": "Group(shell, head, tracers, box, badge, sub, liquid)",
              "VGroup(shell, head, seed_marks, sub, liquid, payoff)": "Group(shell, head, seed_marks, sub, liquid, payoff)",
              "phase = ValueTracker(0)\n        nodes = VGroup": "phase = ValueTracker(0)\n        reactor = always_redraw(lambda: Circle(3.18, fill_color=hex_interp(CYAN, MAGENTA, 0.5 + 0.5 * np.sin(10.0 * phase.get_value())), fill_opacity=0.24, stroke_color=BLUE, stroke_width=1.5, stroke_opacity=0.18).move_to([0, -0.45, 0]))\n        nodes = VGroup",
              "group = VGroup(head, nodes, node_txt, arrows, axes, words)": "group = VGroup(reactor, head, nodes, node_txt, arrows, axes, words)",
              "self.play(FadeOut(VGroup(group, curve, cursor, halo), run_time=0.46))": "reactor.clear_updaters()\n        self.play(FadeOut(VGroup(group, curve, cursor, halo), run_time=0.46))",
              "r = ValueTracker(0.06)": "r = ValueTracker(0.38)",
              "wake = always_redraw(lambda: Circle(max(0.04, r.get_value() - 0.23), stroke_color=MAGENTA, stroke_width=3.4, stroke_opacity=0.46).move_to([cx, cy, 0]))": "wake = always_redraw(lambda: Circle(max(0.04, r.get_value() - 0.23), stroke_color=MAGENTA, stroke_width=3.4, stroke_opacity=0.46).move_to([cx, cy, 0]))\n        wash = always_redraw(lambda: Circle(max(0.10, r.get_value()), fill_color=MAGENTA, fill_opacity=0.10, stroke_width=0).move_to([cx, cy, 0]))",
              "self.add(front, wake)": "self.add(wash, front, wake)",
              "front.clear_updaters(); wake.clear_updaters()": "front.clear_updaters(); wake.clear_updaters(); wash.clear_updaters()",
              "VGroup(shell, head, grid, seed, arrows, sub, front, wake)": "VGroup(shell, head, grid, seed, arrows, sub, front, wake, wash)",
              "RoundedRectangle(width=0.34, height=0.62, corner_radius=0.09": "RoundedRectangle(width=0.46, height=1.70, corner_radius=0.10"
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f"missing expected pattern: {old}")
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Render portrait pilot
        run: |
          manim --disable_caching -r 1440,2560 --fps 60 \
            -o C218_silent.mp4 c218_manim_pilot/main.py C218Scene
          find media -type f -name "C218_silent.mp4" -print
          VIDEO=$(find media -type f -name "C218_silent.mp4" | head -n 1)
          mkdir -p c218_artifact
          cp "$VIDEO" c218_artifact/C218_silent.mp4
          ffprobe -v error -show_entries stream=codec_name,profile,width,height,pix_fmt,r_frame_rate \
            -show_entries format=duration,size -of json "$VIDEO" > c218_artifact/render_probe.json
          sha256sum "$VIDEO" > c218_artifact/render_sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: c218-manim-pilot
          path: c218_artifact/
          compression-level: 0
          retention-days: 1
